name: publish

# Publishing is driven by the tag, not by the branch. A commit on main only has
# to be green; a tag says "this exact tree is the release", so `git push
# --follow-tags` is the whole release ritual.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only test and pack — publish nothing'
        type: boolean
        default: true

jobs:
  publish:
    # Same reason as test.yml: the fixtures carry Windows paths, so the suite
    # (which `prepublishOnly` runs again) only passes here.
    runs-on: windows-latest
    permissions:
      contents: write # gh release create needs this; reading the repo would not
      id-token: write # npm provenance: signs the tarball with this run's OIDC identity
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 22 ships npm 10.
      - run: |
          npm install -g npm@latest --no-audit --no-fund
          npm --version

      - run: npm install --no-audit --no-fund

      # Two ways to authenticate, in order of preference:
      #   - trusted publishing: no secret at all, the registry trusts this
      #     workflow's OIDC identity (configured on the package's npm page);
      #   - NPM_TOKEN: a granular token with "bypass 2FA" checked. npm is
      #     retiring those for direct publishing in Jan 2027, so it is the
      #     fallback, not the goal.
      # setup-node's registry-url writes an .npmrc with an empty ${NODE_AUTH_TOKEN}
      # placeholder; with no token that placeholder makes npm fail before it
      # would ever try OIDC, so point npm at our own file instead.
      - name: authenticate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          $rc = Join-Path $env:RUNNER_TEMP 'npmrc'
          "registry=https://registry.npmjs.org/" | Out-File -Encoding utf8 $rc
          if ($env:NODE_AUTH_TOKEN) {
            "//registry.npmjs.org/:_authToken=$env:NODE_AUTH_TOKEN" | Out-File -Append -Encoding utf8 $rc
            Write-Output "authenticating with the NPM_TOKEN secret"
          } else {
            Write-Output "no NPM_TOKEN — relying on trusted publishing (OIDC)"
          }
          "npm_config_userconfig=$rc" >> $env:GITHUB_ENV

      - name: the tag and package.json must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $ver) {
            Write-Error "tag says $tag, package.json says $ver — bump one of them"
            exit 1
          }
          Write-Output "releasing $ver"

      - name: skip a version that is already on the registry
        id: guard
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $already = $false
          # Ask the registry instead of `npm view`: for a version that does not
          # exist yet npm exits 1, and the runner sets
          # $PSNativeCommandUseErrorActionPreference = $true with
          # $ErrorActionPreference = 'Stop', so that non-zero exit ends the step.
          # That is how the first run of this workflow failed — on the check whose
          # whole job is to discover "not published yet".
          try {
            $meta = Invoke-RestMethod -TimeoutSec 30 -Uri ("https://registry.npmjs.org/" + $pkg.name.Replace('/', '%2f'))
            $already = $null -ne $meta.versions.($pkg.version)
          } catch {
            $already = $false
          }
          if ($already) { Write-Output "$($pkg.name)@$($pkg.version) is already published; re-running this tag is a no-op" }
          "skip=$($already.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: dry run — test and pack, publish nothing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && steps.guard.outputs.skip == 'false'
        run: |
          npm test
          npm pack --dry-run

      - name: publish
        id: publish
        if: steps.guard.outputs.skip == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        # prepublishOnly runs the full suite again, so a red build cannot reach
        # the registry even if this workflow is bypassed.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Only after the registry accepted the tarball: a release page must never
      # exist for a version npm does not have. `gh` is preinstalled on the
      # runners, so this needs no third-party action and no extra secret.
      - name: release this tag on GitHub
        if: startsWith(github.ref, 'refs/tags/v') && steps.guard.outputs.skip == 'false' && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $exists = $false
          # Invoke-RestMethod, not `gh release view`: a 404 is the normal answer
          # here, and a native command's non-zero exit ends the step under the
          # runner's $PSNativeCommandUseErrorActionPreference.
          try {
            Invoke-RestMethod -TimeoutSec 30 -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" | Out-Null
            $exists = $true
          } catch {
            $exists = $false
          }
          if ($exists) {
            Write-Output "a release for $tag already exists; leaving it alone"
            exit 0
          }
          npm pack | Out-Null
          $tgz = (Get-ChildItem *.tgz | Select-Object -First 1).Name
          # --generate-notes only produces "Full Changelog: …" in a repository
          # that does not take pull requests, which is this one. The CHANGELOG
          # section for the version is the notes a reader actually wants, so use
          # that and keep --generate-notes as the fallback.
          $ver = $tag -replace '^v', ''
          $md = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($md, '(?ms)^##\s+' + [regex]::Escape($ver) + '[^\r\n]*\r?\n(.*?)(?=^##\s|\z)')
          if ($section.Success -and $section.Groups[1].Value.Trim()) {
            $file = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            Set-Content -Path $file -Value $section.Groups[1].Value.Trim() -Encoding utf8
            gh release create $tag $tgz --title $tag --notes-file $file
            Write-Output "notes came from CHANGELOG.md, section $ver"
          } else {
            gh release create $tag $tgz --title $tag --generate-notes
            Write-Output "no CHANGELOG section for $ver; falling back to generated notes"
          }
          Write-Output "released $tag with $tgz"
