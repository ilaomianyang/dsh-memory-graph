name: publish

# Publishing is driven by the tag, not by the branch. A commit on main only has
# to be green; a tag says "this exact tree is the release", so `git push
# --follow-tags` is the whole release ritual.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only test and pack — publish nothing'
        type: boolean
        default: true

jobs:
  publish:
    # Same reason as test.yml: the fixtures carry Windows paths, so the suite
    # (which `prepublishOnly` runs again) only passes here.
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # npm provenance: signs the tarball with this run's OIDC identity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install --no-audit --no-fund

      - name: the tag and package.json must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $ver) {
            Write-Error "tag says $tag, package.json says $ver — bump one of them"
            exit 1
          }
          Write-Output "releasing $ver"

      - name: skip a version that is already on the registry
        id: guard
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $already = $false
          npm view "@ilaomianyang/dsh-memory-graph@$ver" version 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $already = $true }
          if ($already) { Write-Output "$ver is already published; re-running this tag is a no-op" }
          "skip=$($already.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: dry run — test and pack, publish nothing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && steps.guard.outputs.skip == 'false'
        run: |
          npm test
          npm pack --dry-run

      - name: publish
        if: steps.guard.outputs.skip == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        # prepublishOnly runs the full suite again, so a red build cannot reach
        # the registry even if this workflow is bypassed.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
